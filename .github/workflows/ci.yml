name: CI — Ubuntu server

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pingmap-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Test and build on personal Ubuntu server
    runs-on: [self-hosted, Linux, X64, nn-ubuntu-ci]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run unit tests
        run: gradle :composeApp:desktopTest :composeApp:testDebugUnitTest --no-daemon
      - name: Build Linux distributable and Android debug APK
        run: |
          gradle :composeApp:createDistributable :composeApp:assembleDebug --no-daemon
          ./composeApp/build/compose/binaries/main/app/PingMap/bin/PingMap --smoke-test
      - name: Package tested binaries and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          tar -C composeApp/build/compose/binaries/main/app -czf ci-artifacts/PingMap-linux-x86_64.tar.gz PingMap
          find composeApp/build/outputs/apk/debug -type f -name '*.apk' -print -quit | xargs -r -I '{}' cp '{}' ci-artifacts/PingMap-android-debug.apk
          test -s ci-artifacts/PingMap-android-debug.apk
          (cd ci-artifacts && sha256sum PingMap-linux-x86_64.tar.gz PingMap-android-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: PingMap-Ubuntu-server-build
          path: ci-artifacts/*
          if-no-files-found: error
          retention-days: 30
