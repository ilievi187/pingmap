name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux-and-android:
    name: Build Linux (AppImage + DEB + RPM) & Android (APK)
    runs-on: [self-hosted, Linux, X64, nn-ubuntu-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Install RPM packaging tool
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Run unit tests
        run: gradle :composeApp:desktopTest :composeApp:testDebugUnitTest --no-daemon

      - name: Build Linux DEB, RPM and distributable
        run: |
          gradle :composeApp:packageDeb :composeApp:packageRpm :composeApp:createDistributable --no-daemon
          ./composeApp/build/compose/binaries/main/app/PingMap/bin/PingMap --smoke-test

      - name: Package Linux AppImage and portable tarball
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi
          chmod +x packaging/linux/build-appimage.sh
          ./packaging/linux/build-appimage.sh "$VERSION"

      - name: Build Android APK
        run: gradle :composeApp:assembleRelease --no-daemon

      - name: Stage Linux & Android release artifacts
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi
          mkdir -p release-artifacts
          cp composeApp/build/compose/binaries/main/deb/*.deb "release-artifacts/pingmap-${VERSION}-amd64.deb"
          cp composeApp/build/compose/binaries/main/rpm/*.rpm "release-artifacts/pingmap-${VERSION}-x86_64.rpm"
          cp "build/PingMap-${VERSION}-x86_64.AppImage" "release-artifacts/"
          cp "build/PingMap-${VERSION}-linux-x86_64.tar.gz" "release-artifacts/"
          APK=$(find composeApp/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK" "release-artifacts/pingmap-${VERSION}-android.apk"
          ls -lh release-artifacts/

      - name: Publish Linux and Android packages to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: PingMap ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: false
          files: release-artifacts/*
          fail_on_unmatched_files: true

  build-windows:
    name: Build Windows (Portable ZIP + MSI)
    if: ${{ vars.PINGMAP_WINDOWS_RUNNER_READY == 'true' }}
    runs-on: [self-hosted, Windows, X64, nn-windows-ci]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Run Windows tests
        run: gradle :composeApp:desktopTest --no-daemon

      - name: Build Windows distributable & MSI
        run: |
          gradle :composeApp:createDistributable :composeApp:packageMsi --no-daemon
          .\composeApp\build\compose\binaries\main\app\PingMap\PingMap.exe --smoke-test

      - name: Stage Windows release artifacts
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($ver) -or $ver -eq "main") { $ver = "1.0.0" }
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Compress-Archive -Path "composeApp/build/compose/binaries/main/app/PingMap/*" -DestinationPath "release-artifacts/PingMap-$ver-windows-x64-portable.zip" -Force
          $msi = Get-ChildItem "composeApp/build/compose/binaries/main/msi/*.msi" | Select-Object -First 1
          Copy-Item $msi.FullName "release-artifacts/PingMap-$ver-windows-x64.msi"
          Get-ChildItem release-artifacts

      - name: Attach Windows packages to the same Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: PingMap ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: false
          files: release-artifacts/*
          fail_on_unmatched_files: true

